# Self-host wOS Chat: docker compose up -d, then open http://localhost:3995
# The first person to sign in becomes the owner. Settings live in .env (see README).
services:
  chat:
    build: .
    image: wos-chat
    restart: unless-stopped
    ports: ["3995:3995"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      FILES_DIR: /data/files
      OAUTH_SECRET: ${OAUTH_SECRET:-change-me-to-a-long-random-string}
    volumes: ["chat-files:/data"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat }
    volumes: ["chat-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U chat"], interval: 5s, retries: 10 }
  # Optional: an S3-compatible file store on your own machine. docker compose --profile s3 up -d,
  # then set S3_BUCKET=chat, S3_ENDPOINT=http://minio:9000, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY in .env.
  minio:
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: chat, MINIO_ROOT_PASSWORD: change-me-please }
    volumes: ["chat-s3:/data"]
volumes: { chat-db: {}, chat-files: {}, chat-s3: {} }
